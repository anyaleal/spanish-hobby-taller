<!-- @dsCard group="Brand" viewport="700x200" name="Iconography" subtitle="Simple solid glyphs inside teal circles. Font Awesome Free 6 (substitute for legacy FA icons)." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); font-family: var(--font-sans); }
  .row { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 9px; width: 84px; }
  .badge { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--teal-600); color: var(--white); font-size: 22px; box-shadow: var(--shadow-sm); }
  .badge.brown { background: var(--brown-500); }
  .badge.outline { background: transparent; border: 1.5px solid var(--teal-600); color: var(--teal-600); }
  .lab { font-size: 11px; color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="badge"><i class="fa-solid fa-eye-low-vision"></i></div><div class="lab">Hidden structure</div></div>
    <div class="item"><div class="badge"><i class="fa-solid fa-puzzle-piece"></i></div><div class="lab">Building blocks</div></div>
    <div class="item"><div class="badge"><i class="fa-solid fa-face-smile-wink"></i></div><div class="lab">Real world</div></div>
    <div class="item"><div class="badge"><i class="fa-solid fa-volume-high"></i></div><div class="lab">Phonetics</div></div>
    <div class="item"><div class="badge brown"><i class="fa-solid fa-brain"></i></div><div class="lab">Semantics</div></div>
    <div class="item"><div class="badge outline"><i class="fa-solid fa-envelope"></i></div><div class="lab">Contact</div></div>
  </div>
</body>
</html>
