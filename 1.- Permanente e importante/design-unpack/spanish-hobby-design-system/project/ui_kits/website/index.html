<script type="text/babel" data-presets="react">
  const { NavBar } = window.SpanishHobbyDesignSystem_99e317;
  const { useState } = React;

  const ROUTES = {
    'Learn Spanish': 'home',
    'The Hidden Structure': 'hidden',
    'The Building Blocks': 'blocks',

    'About': 'about',

  const LABEL = { home: 'Learn Spanish', hidden: 'The Hidden Structure', blocks: 'The Building Blocks', about: 'About' };

  function App() {

    const Screen = { home: window.HomeScreen, hidden: window.HiddenStructureScreen, blocks: window.BuildingBlocksScreen, about: window.AboutScreen }[page];

    return (

          items={['Learn Spanish','The Hidden Structure','The Building Blocks','Real World Spanish','About','Contacto']}
          activeItem={LABEL[page]}
          socials={[{icon:'fa-brands fa-instagram',label:'Instagram'},{icon:'fa-brands fa-tiktok',label:'TikTok'}]}
          onItemClick={go}
        />
        <Screen />
        <window.Footer />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
