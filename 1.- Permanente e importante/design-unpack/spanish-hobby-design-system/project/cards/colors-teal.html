<!-- @dsCard group="Colors" viewport="700x150" name="Teal — Primary" subtitle="The brand's lead color. Headings, primary actions, full-bleed bands." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px; background: var(--surface-page); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }
  .sw span { font-family: var(--font-sans); font-size: 11px; line-height: 1.3; }
  .sw .name { font-weight: 600; }
  .sw .hex { opacity: 0.85; font-variant-numeric: tabular-nums; }
  .dark span { color: rgba(255,255,255,0.95); }
  .light span { color: var(--ink-800); }
  .star { position: absolute; }
  .tag { display: inline-block; margin: 0 0 12px; font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="tag">Primary · #1A6B7C</div>
  <div class="row">
    <div class="sw dark" style="background:var(--teal-900)"><span class="name">900</span><span class="hex">#0B3D47</span></div>
    <div class="sw dark" style="background:var(--teal-800)"><span class="name">800</span><span class="hex">#0E4F5C</span></div>
    <div class="sw dark" style="background:var(--teal-700)"><span class="name">700</span><span class="hex">#14596A</span></div>
    <div class="sw dark" style="background:var(--teal-600)"><span class="name">600 ●</span><span class="hex">#1A6B7C</span></div>
    <div class="sw dark" style="background:var(--teal-500)"><span class="name">500</span><span class="hex">#2C7E8F</span></div>
    <div class="sw light" style="background:var(--teal-300)"><span class="name">300</span><span class="hex">#8FBCC5</span></div>
    <div class="sw light" style="background:var(--teal-100)"><span class="name">100</span><span class="hex">#DCEAEE</span></div>
    <div class="sw light" style="background:var(--teal-50)"><span class="name">50</span><span class="hex">#ECF3F5</span></div>
  </div>
</body>
</html>
