<!-- @dsCard group="Brand" viewport="700x220" name="Logo lockup" subtitle="The book-&-Es mark with the two-tone wordmark: Spanish (teal bold) · Hobby (brown light)." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 0; background: var(--surface-page); font-family: var(--font-sans); }
  .split { display: grid; grid-template-columns: 1fr 1fr; min-height: 220px; }
  .cell { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .on-paper { background: var(--surface-page); }
  .on-teal { background: var(--surface-inverse); }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .lockup img { width: 46px; height: 46px; }
  .on-teal .lockup img { background: var(--white); border-radius: var(--radius-sm); padding: 5px; box-sizing: content-box; width: 40px; height: 40px; }
  .word { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .word .s { color: var(--teal-600); }
  .word .h { color: var(--brown-500); font-weight: 500; }
  .on-teal .word .s { color: var(--white); }
  .on-teal .word .h { color: var(--brown-200); }
</style>
</head>
<body>
  <div class="split">
    <div class="cell on-paper">
      <div class="lockup">
        <img src="../assets/logo-mark.png" alt="Spanish Hobby mark" />
        <span class="word"><span class="s">Spanish</span><span class="h">Hobby</span></span>
      </div>
    </div>
    <div class="cell on-teal">
      <div class="lockup">
        <img src="../assets/logo-mark.png" alt="Spanish Hobby mark" />
        <span class="word"><span class="s">Spanish</span><span class="h">Hobby</span></span>
      </div>
    </div>
  </div>
</body>
</html>
