<!-- @dsCard group="Colors" viewport="700x150" name="Brown — Secondary" subtitle="A quiet secondary accent: utility bar, alternating section bands, editorial warmth." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px; background: var(--surface-page); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }
  .sw span { font-family: var(--font-sans); font-size: 11px; line-height: 1.3; }
  .sw .name { font-weight: 600; }
  .sw .hex { opacity: 0.85; font-variant-numeric: tabular-nums; }
  .dark span { color: rgba(255,255,255,0.95); }
  .light span { color: var(--ink-800); }
  .tag { display: inline-block; margin: 0 0 12px; font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="tag">Secondary · #8B6F47</div>
  <div class="row">
    <div class="sw dark" style="background:var(--brown-700)"><span class="name">700</span><span class="hex">#5E4A30</span></div>
    <div class="sw dark" style="background:var(--brown-600)"><span class="name">600</span><span class="hex">#6F583A</span></div>
    <div class="sw dark" style="background:var(--brown-500)"><span class="name">500 ●</span><span class="hex">#8B6F47</span></div>
    <div class="sw dark" style="background:var(--brown-400)"><span class="name">400</span><span class="hex">#A78B62</span></div>
    <div class="sw light" style="background:var(--brown-300)"><span class="name">300</span><span class="hex">#C2AC88</span></div>
    <div class="sw light" style="background:var(--brown-200)"><span class="name">200</span><span class="hex">#DBCBB1</span></div>
    <div class="sw light" style="background:var(--brown-100)"><span class="name">100</span><span class="hex">#ECE2D2</span></div>
    <div class="sw light" style="background:var(--brown-50)"><span class="name">50</span><span class="hex">#F4EDE2</span></div>
  </div>
</body>
</html>
