<!DOCTYPE html>
<html lang="en">
<head>

<body>

  <script src="../../_ds_bundle.js"></script>

  <script type="text/babel">

              <Logo markSrc={A.replace('img/','') + 'logo-mark.png'} size="md" />
              <div style={{ background: 'var(--surface-inverse)', padding: '14px 20px', borderRadius: 'var(--radius-md)' }}>
                <Logo markSrc={A.replace('img/','') + 'logo-mark.png'} size="md" onDark />

            </div>
          </div>

          <div className="block">
            <p className="lab">Feature cards</p>
            <div className="grid3">
              <FeatureCard icon="fa-solid fa-eye-low-vision" title="The Hidden Structure">
                What gives Spanish its shape and logic — what you don't see, but is always there.
              </FeatureCard>
              <FeatureCard icon="fa-solid fa-puzzle-piece" title="The Building Blocks" highlighted>
                Learn what each piece does, how it behaves, and how they all fit together.
              </FeatureCard>
              <FeatureCard icon="fa-solid fa-face-smile-wink" title="Real World Spanish">
                How it's spoken, how it's mastered, how it's lived.
              </FeatureCard>
            </div>
          </div>

          <div className="block">
            <p className="lab">Article cards</p>
            <div className="grid3">
              <ArticleCard image={A+'structure-1.jpg'} title="Spanish Semantics & Pragmatics" date="May 29th, 2025"
                excerpt="Go beyond words to understand what's said and what's meant." />
              <ArticleCard image={A+'tonal-warm.jpg'} title="Spanish Interjections" date="June 13th, 2025"
                excerpt="Interjections add emotion, authenticity and rhythm — the sparks of a conversation." />

                excerpt="Beyond slang: the social codes, habits and emotion of real conversations." />
            </div>
          </div>

          <div className="block">
