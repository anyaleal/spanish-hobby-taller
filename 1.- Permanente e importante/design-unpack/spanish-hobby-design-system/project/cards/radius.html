<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="Cards sit at 10px (8–12px brand range). Pills for tags; sharp only for rules." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); font-family: var(--font-sans); }
  .row { display: flex; gap: 22px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .box { width: 80px; height: 80px; background: var(--white); border: 1.5px solid var(--teal-400); box-shadow: var(--shadow-sm); }
  .lab { font-size: 11px; color: var(--text-muted); text-align: center; }
  .lab b { display: block; color: var(--text-strong); font-size: 12px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lab"><b>sm · 6</b>buttons, inputs</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lab"><b>md · 10</b>cards, images</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lab"><b>lg · 14</b>panels</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lab"><b>xl · 20</b>feature</div></div>
    <div class="item"><div class="box" style="width:120px;height:40px;border-radius:var(--radius-pill)"></div><div class="lab"><b>pill</b>tags, chips</div></div>
  </div>
</body>
</html>
