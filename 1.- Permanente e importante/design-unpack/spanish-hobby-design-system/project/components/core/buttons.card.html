<!DOCTYPE html>

<body>

    function Demo() {
      return (
        <div>
          <div className="block">
            <p className="lab">Buttons</p>
            <div className="row">
              <Button variant="primary" iconRight="fa-solid fa-arrow-right">Go to The Hidden Structure</Button>
              <Button variant="outline">Learn more</Button>
              <Button variant="accent">Begin a free lesson</Button>
              <Button variant="ghost" icon="fa-solid fa-play">Listen</Button>
              <Button variant="primary" disabled>Disabled</Button>
            </div>
          </div>

          <div className="block">
            <p className="lab">Sizes</p>

              <Button variant="primary" size="sm">Small</Button>
              <Button variant="primary" size="md">Medium</Button>
              <Button variant="primary" size="lg">Large</Button>
            </div>
          </div>

          <div className="block">
            <p className="lab">Icon buttons</p>
            <div className="row">
              <IconButton icon="fa-solid fa-volume-high" label="Play audio" variant="solid" />
              <IconButton icon="fa-solid fa-brain" label="Semantics" variant="brown" />
              <IconButton icon="fa-brands fa-instagram" label="Instagram" variant="outline" />
              <IconButton icon="fa-solid fa-envelope" label="Email" variant="ghost" />
              <IconButton icon="fa-solid fa-arrow-up" label="Top" variant="accent" size="sm" />

          </div>

          <div className="block">

              <Eyebrow color="accent" rule>Real World Spanish</Eyebrow>

              <Badge tone="orange" variant="solid">Free</Badge>
              <Badge tone="brown" variant="outline" icon="fa-solid fa-volume-high">Phonetics</Badge>

              <Badge tone="success" icon="fa-solid fa-check">No sign-up</Badge>
            </div>

          <div className="teal-band">

            <div className="row">
              <Button variant="on-teal">Primary</Button>
              <Button variant="outline-on-teal">Outline</Button>

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
